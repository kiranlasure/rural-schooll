<div class="teacher-dashboard">
  <header class="dashboard-header">
    <h1 class="app-title">Rural School Portal</h1>
    <p class="welcome-text">Welcome, Teacher</p>
  </header>

  <main class="dashboard-content">
    <button type="button" class="dashboard-card" (click)="navigateToMarkAttendance()">
      <span class="card-title">Mark Attendance</span>
    </button>

    <button type="button" class="dashboard-card">
      <span class="card-title">View Attendance Report</span>
    </button>

    <button type="button" class="dashboard-card">
      <span class="card-title">Upload Results</span>
    </button>

    <button type="button" class="dashboard-card">
      <span class="card-title">Events &amp; Notices</span>
    </button>
  </main>
</div>
