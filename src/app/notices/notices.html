<div class="notices-page">
  <div class="container py-3">
    <header class="page-header mb-3">
      <h1 class="page-title h4 mb-0">Events &amp; Notices</h1>
    </header>

    <section class="notices-list">
      <div class="row g-3">
        <div class="col-12" *ngFor="let notice of notices">
          <div class="card">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-start mb-2">
                <h5 class="card-title mb-0">{{ notice.title }}</h5>
                <span [ngClass]="getTypeClass(notice.type)">{{ notice.type }}</span>
              </div>
              <p class="card-text text-muted mb-2">{{ notice.description }}</p>
              <small class="text-muted">
                📅 {{ formatDate(notice.date) }}
              </small>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>
